<!DOCTYPE html>
<html>
<head>
    <title>Flight Schedule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; color: #333; }
        h2 { color: #0066cc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #0066cc; color: white; }
    </style>
</head>
<body>
    <h2>Flight Schedules</h2>
    <table>
        <tr>
            <th>Flight Name</th>
            <th>Starting Place</th>
            <th>Destination</th>
            <th>Arrival Time</th>
            <th>Airfare ($)</th>
        </tr>
        <tr>
            <td>TA-101</td>
            <td>Lagos (LOS)</td>
            <td>London (LHR)</td>
            <td>06:00 AM</td>
            <td>$850</td>
        </tr>
        <tr>
            <td>TA-202</td>
            <td>Abuja (ABV)</td>
            <td>New York (JFK)</td>
            <td>02:30 PM</td>
            <td>$1,200</td>
        </tr>
    </table>
</body>
</html>
