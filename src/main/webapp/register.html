<!DOCTYPE html>
<html>
<head>
    <title>Flight Registration</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; color: #333; }
        h2 { color: #0066cc; }
        form { max-width: 500px; background: #f9f9f9; padding: 20px; border: 1px solid #ddd; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn-group { margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Flight Booking Registration</h2>
    <form action="#" method="POST">
        <div>
            <label>First Name:</label>
            <input type="text" name="firstname" required>
        </div>
        <div>
            <label>Last Name:</label>
            <input type="text" name="lastname" required>
        </div>
        <div>
            <label>Age:</label>
            <input type="number" name="age" required>
        </div>
        <div>
            <label>Email ID:</label>
            <input type="email" name="email" required>
        </div>
        <div>
            <label>Gender:</label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>
        <div>
            <label>Select Flight:</label>
            <select name="flight">
                <option value="TA-101">TA-101: Lagos to London</option>
                <option value="TA-202">TA-202: Abuja to New York</option>
            </select>
        </div>
        <div>
            <label>Comments or Suggestions:</label>
            <textarea name="comments" rows="4"></textarea>
        </div>
        <div class="btn-group">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>
</body>
</html>
